<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 홈이 /main 에서 도메인 루트로 옮겨졌다. GitHub Pages 는 301 을 보낼 수 없으므로
     canonical 로 새 주소를 알리고 즉시 이동시킨다. noindex 는 넣지 않는다 —
     색인에서 지우는 게 아니라 새 주소로 합쳐야 하기 때문이다. -->
<link rel="canonical" href="https://www.lawyeonvisa.app/ko/">
<meta http-equiv="refresh" content="0; url=/ko/">
<meta property="og:site_name" content="Law Firm Lawyeon Immigration Center">
<title>법무법인 로연 출입국이민지원센터</title>
</head>
<body>
<p><a href="/ko/">홈이 이동했습니다. 새 주소로 이동합니다.</a></p>
<script>location.replace('/ko/');</script>
</body>
</html>
